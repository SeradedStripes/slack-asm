services:
  app:
    image: ghcr.io/seradedstripes/slack-asm
    volumes:
      - ./.env:/.env:ro
    networks:
      - slack-asm

  watchtower:
    image: containrrr/watchtower
    environment:
      - DOCKER_API_VERSION=1.40
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - slack-asm

networks:
  slack-asm:
